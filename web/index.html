<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <script>
    try { var t = JSON.parse(localStorage.getItem('devtrack.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

      <button id="update-pill" class="update-pill" data-action="apply-update" data-i18n="새 업데이트 보기">새 업데이트 보기</button>

      <button id="lang-btn" class="icon-btn lang-btn" data-action="lang" title="Switch to English" aria-label="Switch to English">EN</button>
      <button id="theme-btn" class="icon-btn" data-action="theme" aria-label="테마 전환" title="라이트/다크 전환" data-i18n-aria="테마 전환" data-i18n-title="라이트/다크 전환"></button>

      <a class="nav-item" href="#/code" data-nav="code">

      </a>
