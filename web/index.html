<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTrack · AI 개발 진행 현황</title>
  <meta name="description" content="AI 에이전트의 개발 진행상황, 문제점, 결과물을 확인하고 승인하는 대시보드">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5ccc'/%3E%3Cpolyline points='7 17 12 17 15 9 19 23 22 15 25 15' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    try { var t = JSON.parse(localStorage.getItem('devtrack.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/hljs-latex.min.js"></script>
  <script src="vendor/hljs-fortran.min.js"></script>
  <script src="vendor/hljs-julia.min.js"></script>
  <script src="vendor/hljs-matlab.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="menu" aria-label="메뉴">
        <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
        <span class="brand-text">DevTrack<small>AI 개발 진행 현황</small></span>
      </a>
      <button id="update-pill" class="update-pill" data-action="apply-update">새 업데이트 보기</button>
      <span id="mode-chip" class="mode-chip"><span class="dot"></span><span>연결 중…</span></span>
      <button id="refresh-btn" class="icon-btn" data-action="refresh" aria-label="새로고침" title="새로고침">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" data-action="theme" aria-label="테마 전환" title="라이트/다크 전환"></button>
      <button class="icon-btn" data-action="bell" aria-label="알림" title="알림">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="bell-count" class="count" hidden>0</span>
        <span id="bell-dot" class="dot" hidden></span>
      </button>
    </header>

    <nav class="sidebar" aria-label="주 메뉴">
      <a class="btn btn-primary nav-cta" href="#/new" data-nav="new">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 새 작업 지시
      </a>
      <a class="nav-item" href="#/" data-nav="dashboard">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> 대시보드
      </a>
      <a class="nav-item" href="#/tasks" data-nav="tasks">
        <svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> 작업
      </a>
      <a class="nav-item" href="#/approvals" data-nav="approvals">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 승인 요청
        <span id="nav-approvals-count" class="badge-count" hidden></span>
      </a>
      <a class="nav-item" href="#/reviews" data-nav="reviews">
        <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 코드 리뷰
      </a>
      <a class="nav-item" href="#/artifacts" data-nav="artifacts">
        <svg class="icon" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 결과물
      </a>
      <a class="nav-item" href="#/activity" data-nav="activity">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> 활동 기록
      </a>
      <div class="sidebar-foot" id="sync-info"></div>
    </nav>
    <div class="scrim" data-action="menu"></div>

    <main id="main" tabindex="-1"><div class="empty">불러오는 중…</div></main>
  </div>

  <div id="notif-dd" class="dropdown" role="dialog" aria-label="알림"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
