<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Helvetica, Arial, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <title>Structure of the manuscript</title>
  <desc>The five parts of the manuscript from left to right, with the key statements and numbers of each part.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="40" y="64" font-size="26" font-weight="bold" fill="#1f2937">How the manuscript is built</text>
  <text x="40" y="96" font-size="15" fill="#6b7280">Linear pipeline: each part and the statements it makes</text>

  <!-- Abstract -->
  <rect x="40" y="120" width="192" height="272" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="136" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#4b5563">Abstract</text>
  <path d="M56 168 H216" stroke="#4b5563" stroke-opacity="0.3"/>
  <text x="136" y="200" font-size="14" text-anchor="middle" fill="#1f2937">DNS + hot-wire</text>
  <text x="136" y="220" font-size="14" text-anchor="middle" fill="#1f2937">measurements</text>
  <text x="136" y="256" font-size="14" text-anchor="middle" fill="#1f2937">“good agreement”</text>
  <text x="136" y="292" font-size="14" text-anchor="middle" fill="#1f2937">“universal near-wall</text>
  <text x="136" y="312" font-size="14" text-anchor="middle" fill="#1f2937">behaviour”</text>

  <!-- Introduction -->
  <rect x="272" y="120" width="192" height="272" rx="12" fill="#efeafb" stroke="#7b5cc4" stroke-width="1.5"/>
  <text x="368" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#7b5cc4">§1 Introduction</text>
  <path d="M288 168 H448" stroke="#7b5cc4" stroke-opacity="0.3"/>
  <text x="368" y="200" font-size="14" text-anchor="middle" fill="#1f2937">prior work:</text>
  <text x="368" y="220" font-size="14" text-anchor="middle" fill="#1f2937">kim1987, moser1999,</text>
  <text x="368" y="240" font-size="14" text-anchor="middle" fill="#1f2937">lee2015</text>
  <text x="368" y="276" font-size="14" text-anchor="middle" fill="#1f2937">skewness sensitive</text>
  <text x="368" y="296" font-size="14" text-anchor="middle" fill="#1f2937">to resolution</text>
  <text x="368" y="332" font-size="14" text-anchor="middle" fill="#1f2937">“first study of</text>
  <text x="368" y="352" font-size="14" text-anchor="middle" fill="#1f2937">near-wall skewness”</text>

  <!-- Methods -->
  <rect x="504" y="120" width="192" height="272" rx="12" fill="#e8eefc" stroke="#3a5ccc" stroke-width="1.5"/>
  <text x="600" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#3a5ccc">§2 Methods</text>
  <path d="M520 168 H680" stroke="#3a5ccc" stroke-opacity="0.3"/>
  <text x="600" y="200" font-size="14" text-anchor="middle" fill="#1f2937">DNS at Re<tspan font-size="11" dy="4">τ</tspan><tspan dy="-4"> = 180</tspan></text>
  <text x="600" y="236" font-size="14" text-anchor="middle" fill="#1f2937">256 × 128 × 256 grid</text>
  <text x="600" y="272" font-size="14" text-anchor="middle" fill="#1f2937">hot-wire probe, 1 mm</text>
  <text x="600" y="308" font-size="14" text-anchor="middle" fill="#1f2937">matching Re<tspan font-size="11" dy="4">τ</tspan></text>

  <!-- Results -->
  <rect x="736" y="120" width="192" height="272" rx="12" fill="#e2f4f4" stroke="#0f8b8d" stroke-width="1.5"/>
  <text x="832" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f8b8d">§3 Results</text>
  <path d="M752 168 H912" stroke="#0f8b8d" stroke-opacity="0.3"/>
  <text x="832" y="200" font-size="14" text-anchor="middle" fill="#1f2937">S<tspan font-size="11" dy="4">u</tspan><tspan dy="-4"> at the wall:</tspan></text>
  <text x="832" y="220" font-size="14" text-anchor="middle" fill="#1f2937">0.98 (DNS) / 1.09 (exp.)</text>
  <text x="832" y="256" font-size="14" text-anchor="middle" fill="#1f2937">difference 10.7 %</text>
  <text x="832" y="292" font-size="14" text-anchor="middle" fill="#1f2937">increases towards</text>
  <text x="832" y="312" font-size="14" text-anchor="middle" fill="#1f2937">the wall</text>
  <text x="832" y="348" font-size="14" text-anchor="middle" fill="#1f2937">sign change at y⁺ ≈ 15</text>

  <!-- Conclusions -->
  <rect x="968" y="120" width="192" height="272" rx="12" fill="#fdf0e2" stroke="#d9822b" stroke-width="1.5"/>
  <text x="1064" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#d9822b">§4 Conclusions</text>
  <path d="M984 168 H1144" stroke="#d9822b" stroke-opacity="0.3"/>
  <text x="1064" y="200" font-size="14" text-anchor="middle" fill="#1f2937">“universal and</text>
  <text x="1064" y="220" font-size="14" text-anchor="middle" fill="#1f2937">independent of the</text>
  <text x="1064" y="240" font-size="14" text-anchor="middle" fill="#1f2937">Reynolds number”</text>
  <text x="1064" y="276" font-size="14" text-anchor="middle" fill="#1f2937">“agree well”</text>
  <text x="1064" y="312" font-size="14" text-anchor="middle" fill="#1f2937">“validates both</text>
  <text x="1064" y="332" font-size="14" text-anchor="middle" fill="#1f2937">approaches”</text>

  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M232 256 H268"/><path d="M464 256 H500"/><path d="M696 256 H732"/><path d="M928 256 H964"/>
  </g>

  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="136" y="424">summary</text><text x="368" y="424">background</text><text x="600" y="424">method</text>
    <text x="832" y="424">result</text><text x="1064" y="424">conclusion</text>
  </g>
  <text x="40" y="460" font-size="13" fill="#6b7280">Quotes are verbatim from the manuscript; numbers from §2–§3.</text>
</svg>
