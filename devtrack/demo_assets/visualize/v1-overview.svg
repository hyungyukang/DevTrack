<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Helvetica, Arial, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <title>DNS vs hot-wire: near-wall velocity skewness</title>
  <desc>Two data sources, DNS at Re_tau 180 and a hot-wire experiment, feed one comparison of the streamwise velocity skewness S_u, which leads to the paper's conclusions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="64" font-size="26" font-weight="bold" fill="#1f2937">Near-wall velocity skewness: DNS vs hot-wire</text>
  <text x="40" y="96" font-size="15" fill="#6b7280">Turbulent channel flow · two data sources → one comparison → conclusions</text>

  <!-- Zone A: DNS -->
  <rect x="40" y="128" width="520" height="200" rx="16" fill="#e8eefc" stroke="#3a5ccc" stroke-width="2"/>
  <text x="64" y="160" font-size="20" font-weight="bold" fill="#3a5ccc">DNS</text>
  <rect x="64" y="184" width="216" height="120" rx="10" fill="#ffffff" stroke="#3a5ccc"/>
  <g stroke="#3a5ccc" stroke-width="1.2" fill="none">
    <rect x="120" y="196" width="104" height="48"/>
    <path d="M146 196 V244 M172 196 V244 M198 196 V244 M120 212 H224 M120 228 H224"/>
  </g>
  <text x="172" y="276" font-size="16" text-anchor="middle" fill="#1f2937">256 × 128 × 256</text>
  <text x="172" y="296" font-size="14" text-anchor="middle" fill="#6b7280">grid</text>
  <rect x="304" y="184" width="232" height="120" rx="10" fill="#ffffff" stroke="#3a5ccc"/>
  <text x="420" y="236" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Re<tspan font-size="16" dy="6">τ</tspan><tspan dy="-6"> = 180</tspan></text>
  <text x="420" y="272" font-size="14" text-anchor="middle" fill="#6b7280">friction Reynolds number</text>

  <!-- Zone B: hot-wire experiment -->
  <rect x="40" y="360" width="520" height="200" rx="16" fill="#fdf0e2" stroke="#d9822b" stroke-width="2"/>
  <text x="64" y="392" font-size="20" font-weight="bold" fill="#d9822b">Hot-wire experiment</text>
  <rect x="64" y="416" width="216" height="120" rx="10" fill="#ffffff" stroke="#d9822b"/>
  <g stroke="#d9822b" fill="none" stroke-linecap="round">
    <path d="M104 456 H192" stroke-width="5"/>
    <path d="M192 446 V466 M192 446 H212 M192 466 H212" stroke-width="2"/>
    <path d="M212 446 V466" stroke-width="1"/>
  </g>
  <text x="172" y="500" font-size="16" text-anchor="middle" fill="#1f2937">single hot-wire probe</text>
  <text x="172" y="520" font-size="14" text-anchor="middle" fill="#6b7280">length 1 mm</text>
  <rect x="304" y="416" width="232" height="120" rx="10" fill="#ffffff" stroke="#d9822b"/>
  <text x="420" y="468" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">matching Re<tspan font-size="14" dy="5">τ</tspan></text>
  <text x="420" y="504" font-size="14" text-anchor="middle" fill="#6b7280">wind tunnel</text>

  <!-- streams into the comparison -->
  <path d="M560 228 H636" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M560 460 H636" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Zone C: results -->
  <rect x="640" y="128" width="520" height="432" rx="16" fill="#e2f4f4" stroke="#0f8b8d" stroke-width="2"/>
  <text x="664" y="160" font-size="20" font-weight="bold" fill="#0f8b8d">Skewness S<tspan font-size="14" dy="5">u</tspan><tspan dy="-5"> (Results, §3)</tspan></text>
  <rect x="664" y="184" width="472" height="160" rx="10" fill="#ffffff" stroke="#0f8b8d"/>
  <text x="688" y="216" font-size="16" font-weight="bold" fill="#1f2937">At the wall</text>
  <text x="688" y="258" font-size="15" fill="#1f2937">DNS</text>
  <rect x="760" y="240" width="274" height="24" rx="4" fill="#3a5ccc"/>
  <text x="1042" y="258" font-size="15" font-weight="bold" fill="#1f2937">0.98</text>
  <text x="688" y="298" font-size="15" fill="#1f2937">Exp.</text>
  <rect x="760" y="280" width="305" height="24" rx="4" fill="#d9822b"/>
  <text x="1073" y="298" font-size="15" font-weight="bold" fill="#1f2937">1.09</text>
  <text x="688" y="332" font-size="14" fill="#6b7280">difference 10.7 %</text>

  <rect x="664" y="368" width="472" height="168" rx="10" fill="#ffffff" stroke="#0f8b8d"/>
  <text x="688" y="400" font-size="16" font-weight="bold" fill="#1f2937">Profile</text>
  <text x="688" y="436" font-size="15" fill="#1f2937">increases towards the wall</text>
  <text x="688" y="468" font-size="15" fill="#1f2937">changes sign at y⁺ ≈ 15</text>
  <text x="688" y="496" font-size="14" fill="#6b7280">in both data sets</text>
  <g fill="none">
    <path d="M976 472 H1112" stroke="#9ca3af" stroke-dasharray="4 4"/>
    <path d="M976 392 V520" stroke="#9ca3af"/>
    <polyline points="984,416 1008,432 1032,452 1048,472 1072,492 1104,508" stroke="#0f8b8d" stroke-width="2.5"/>
    <circle cx="1048" cy="472" r="4" fill="#0f8b8d"/>
  </g>
  <text x="1056" y="460" font-size="13" fill="#6b7280">y⁺ ≈ 15</text>
  <text x="1114" y="490" font-size="13" fill="#6b7280">y⁺</text>
  <text x="948" y="404" font-size="13" fill="#6b7280">S<tspan font-size="10" dy="3">u</tspan></text>
  <text x="984" y="530" font-size="13" fill="#6b7280">schematic</text>

  <!-- to conclusions -->
  <path d="M900 560 V588" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Zone D: conclusions -->
  <rect x="40" y="592" width="1120" height="88" rx="16" fill="#efeafb" stroke="#7b5cc4" stroke-width="2"/>
  <text x="64" y="626" font-size="18" font-weight="bold" fill="#7b5cc4">Conclusions (§4)</text>
  <text x="64" y="658" font-size="15" fill="#1f2937">“near-wall skewness is universal and independent of the Reynolds number” · “the DNS and the experiment agree well”</text>

  <text x="40" y="708" font-size="13" fill="#6b7280">Sources: §2 Methods (grid, Reynolds number, probe) · §3 Results (skewness values, sign change) · §4 Conclusions</text>
</svg>
